version: 0.1
projects:
  - path: envs/nonprod
    name: aws-nonprod
    terraform_vars:
      vpc_cidr: 10.30.0.0/16
      operator_role_arn: arn:aws:iam::123456789012:role/ClusterOperator
      operator_access_cidrs:
        - 10.50.0.0/24
  - path: envs/prod
    name: aws-prod
    terraform_vars:
      vpc_cidr: 10.40.0.0/16
      operator_role_arn: arn:aws:iam::123456789012:role/ClusterOperator
      operator_access_cidrs:
        - 10.50.0.0/24
      budget:
        monthly_limit_usd: 500
        email: finops@example.com
  - path: envs/gke
    name: gcp-gke
    terraform_var_files:
      - terraform.tfvars.example
    terraform_vars:
      project_id: cost-aware-infracost
      operator_member: group:platform@example.com
      operator_access_cidrs:
        - 10.50.0.0/24
  - path: envs/aks
    name: azure-aks
    terraform_var_files:
      - terraform.tfvars.example
    terraform_vars:
      subscription_id: 11111111-1111-1111-1111-111111111111
      tenant_id: 22222222-2222-2222-2222-222222222222
      operator_group_object_id: 33333333-3333-3333-3333-333333333333
