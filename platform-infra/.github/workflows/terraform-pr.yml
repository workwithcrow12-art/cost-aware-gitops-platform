name: Terraform pull request

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false
      - run: make validate
      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4
        with:
          tflint_version: v0.61.0
      - run: make lint
      - name: Test EKS and explicit-context bootstrap
        run: python3 -m unittest discover -s tests -v
      - name: Verify cost tagging policy
        run: docker run --rm --network none -v "$PWD/policies:/policy:ro" openpolicyagent/conftest:v0.62.0 verify --policy /policy
