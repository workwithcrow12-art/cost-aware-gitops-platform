apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root
  namespace: argocd
spec:
  project: bootstrap
  source:
    repoURL: https://github.com/workwithcrow12-art/cost-aware-gitops-platform.git
    targetRevision: main
    path: gitops-config/bootstrap/nonprod
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 8
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
