apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-downscaler-rbac
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/workwithcrow12-art/cost-aware-gitops-platform.git
    targetRevision: main
    path: gitops-config/platform/kube-downscaler
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-downscaler
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
