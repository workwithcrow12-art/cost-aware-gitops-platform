apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  sourceRepos:
    - https://github.com/workwithcrow12-art/cost-aware-gitops-platform.git
    - https://argoproj.github.io/argo-helm
    - https://prometheus-community.github.io/helm-charts
    - https://opencost.github.io/opencost-helm-chart
    - https://kyverno.github.io/kyverno
    - https://bitnami.github.io/sealed-secrets
    - https://caas-team.github.io/helm-charts
    - https://kubernetes-sigs.github.io/metrics-server/
  destinations:
    - {server: https://kubernetes.default.svc, namespace: argo-rollouts}
    - {server: https://kubernetes.default.svc, namespace: monitoring}
    - {server: https://kubernetes.default.svc, namespace: opencost}
    - {server: https://kubernetes.default.svc, namespace: kyverno}
    - {server: https://kubernetes.default.svc, namespace: sealed-secrets}
    - {server: https://kubernetes.default.svc, namespace: kube-downscaler}
    - {server: https://kubernetes.default.svc, namespace: kube-system}
    - {server: https://kubernetes.default.svc, namespace: finops}
    - {server: https://kubernetes.default.svc, namespace: boutique-dev}
    - {server: https://kubernetes.default.svc, namespace: boutique-staging}
  clusterResourceWhitelist:
    - {group: "", kind: Namespace}
    - {group: apiextensions.k8s.io, kind: CustomResourceDefinition}
    - {group: rbac.authorization.k8s.io, kind: ClusterRole}
    - {group: rbac.authorization.k8s.io, kind: ClusterRoleBinding}
    - {group: admissionregistration.k8s.io, kind: ValidatingWebhookConfiguration}
    - {group: admissionregistration.k8s.io, kind: MutatingWebhookConfiguration}
    - {group: apiregistration.k8s.io, kind: APIService}
    - {group: kyverno.io, kind: ClusterPolicy}
    - {group: storage.k8s.io, kind: StorageClass}
