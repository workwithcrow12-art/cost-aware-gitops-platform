apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-notifications
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/workwithcrow12-art/cost-aware-gitops-platform.git
    targetRevision: main
    path: gitops-config/platform/monitoring/notifications
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
