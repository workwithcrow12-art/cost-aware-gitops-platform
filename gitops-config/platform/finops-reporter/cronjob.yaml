apiVersion: batch/v1
kind: CronJob
metadata:
  name: finops-reporter
spec:
  schedule: "0 8 * * 1"
  timeZone: Asia/Ho_Chi_Minh
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: finops-reporter
          containers:
            - name: reporter
              image: ghcr.io/workwithcrow12-art/finops-toolkit:v0.9
              args:
                - report
              env:
                - name: OPENCOST_URL
                  value: http://opencost.opencost.svc.cluster.local:9003
              envFrom:
                - secretRef:
                    name: finops-reporter
                    optional: true
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
