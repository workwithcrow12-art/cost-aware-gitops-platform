apiVersion: batch/v1
kind: CronJob
metadata:
  name: finops-reporter
spec:
  schedule: "0 8 * * 1"
  timeZone: Asia/Ho_Chi_Minh
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            team: platform
            env: shared
        spec:
          restartPolicy: Never
          serviceAccountName: finops-reporter
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reporter
              # Pinned to the immutable @sha256 digest emitted by release.yml and updated by promote-images.yml.
              image: ghcr.io/workwithcrow12-art/finops-toolkit@sha256:19bfd4a197440f0ee1558340cd9e1fdaa6a82626b1f6c1e70024d66d50a14c2e
              args:
                - report
              env:
                - name: OPENCOST_URL
                  value: http://opencost.opencost.svc.cluster.local:9003
              envFrom:
                - secretRef:
                    name: finops-reporter
                    optional: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
