# The constrained chart Roles cover workloads, but Namespaces are cluster-scoped.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-downscaler-namespace-reader
rules:
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [boutique-dev, boutique-staging]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-downscaler-namespace-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-downscaler-namespace-reader
subjects:
  - kind: ServiceAccount
    name: kube-downscaler
    namespace: kube-downscaler
