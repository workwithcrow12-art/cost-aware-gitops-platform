fullnameOverride: monitoring
alertmanager:
  enabled: true
  alertmanagerSpec:
    alertmanagerConfigSelector:
      matchLabels:
        alertmanager: monitoring
    alertmanagerConfigNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
    # Cluster cost and reporter alerts are not in the monitoring namespace.
    alertmanagerConfigMatcherStrategy:
      type: None
grafana:
  enabled: true
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
prometheus:
  prometheusSpec:
    retention: 15d
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 200m
        memory: 384Mi
      limits:
        memory: 1Gi
kube-state-metrics:
  metricLabelsAllowlist:
    - pods=[team,env]
    - namespaces=[team,env]
