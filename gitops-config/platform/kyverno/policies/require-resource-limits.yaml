apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
spec:
  background: true
  rules:
    - name: compute-resources
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - boutique-*
                - finops
      validate:
        failureAction: Enforce
        message: Containers must declare CPU and memory requests and limits.
        # Kubernetes API validation forbids resources on ephemeralContainers;
        # require-image-digest and require-restricted-pods still evaluate them.
        foreach:
          - list: "request.object.spec.[initContainers, containers][]"
            pattern:
              resources:
                requests:
                  cpu: "?*"
                  memory: "?*"
                limits:
                  cpu: "?*"
                  memory: "?*"
