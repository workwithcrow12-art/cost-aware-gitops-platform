apiVersion: v1
kind: Pod
metadata:
  name: finops-valid
  namespace: finops
  labels:
    team: platform
    env: shared
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: reporter
      image: ghcr.io/workwithcrow12-art/finops-toolkit@sha256:7acf0b4eec01a2fc3e73562dac1add7b18836a9982b99a1e54467d66c57a4247
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 256Mi
---
