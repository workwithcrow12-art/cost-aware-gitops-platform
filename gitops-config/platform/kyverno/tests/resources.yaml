apiVersion: v1
kind: Pod
metadata:
  name: valid
  namespace: boutique-dev
  labels:
    team: boutique
    env: dev
spec:
  containers:
    - name: redis
      image: redis@sha256:1111111111111111111111111111111111111111111111111111111111111111
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
