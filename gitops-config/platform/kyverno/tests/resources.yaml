---
apiVersion: v1
kind: Pod
metadata:
  name: finops-unrestricted
  namespace: finops
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 0
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: reporter
      image: ghcr.io/workwithcrow12-art/finops-toolkit:v0.9
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
