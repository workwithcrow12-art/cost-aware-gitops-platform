apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: boutique-dev
resources:
  - ../../base
  - namespace.yaml
components:
  - ../../components/loadgenerator
  - ../../components/restricted
labels:
  - pairs:
      team: boutique
      env: dev
    includeTemplates: true
replacements:
  - source:
      kind: Namespace
      name: boutique-dev
      fieldPath: metadata.name
    targets:
      - select:
          kind: Rollout
          name: frontend
        fieldPaths:
          - spec.strategy.canary.steps.2.analysis.args.0.value
          - spec.strategy.canary.steps.5.analysis.args.0.value
      - select:
          kind: Probe
          name: frontend-canary
        fieldPaths:
          - spec.targets.staticConfig.static.0
        options:
          delimiter: "."
          index: 1
