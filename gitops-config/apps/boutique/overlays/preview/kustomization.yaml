apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: boutique-preview
resources:
  - ../../base
components:
  - ../../components/restricted
labels:
  - pairs:
      team: boutique
      env: preview
    includeTemplates: true
patches:
  # Previews use the upstream cart service's in-memory fallback.
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cartservice
      spec:
        template:
          spec:
            containers:
              - name: server
                env:
                  - name: REDIS_PASSWORD
                    $patch: delete
                  - name: REDIS_ADDR
                    $patch: delete
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: redis-cart
      $patch: delete
  - patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: redis-cart
      $patch: delete
  - patch: |
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-frontend-probes
      $patch: delete
  - target:
      kind: Rollout
      name: frontend
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: remove
        path: /spec/strategy/canary/steps
  - patch: |
      apiVersion: argoproj.io/v1alpha1
      kind: AnalysisTemplate
      metadata:
        name: frontend-canary
      $patch: delete
  - patch: |
      apiVersion: monitoring.coreos.com/v1
      kind: Probe
      metadata:
        name: frontend-canary
      $patch: delete
images:
  - name: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/adservice
    newName: ghcr.io/workwithcrow12-art/adservice
    digest: sha256:c71032e03cb5cc0ce2cc27b99c37175d980074c63083bda2e733187cf52d178c
