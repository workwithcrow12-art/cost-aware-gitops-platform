apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: boutique-staging
resources:
  - ../../base
  - namespace.yaml
components:
  - ../../components/loadgenerator
  - ../../components/restricted
labels:
  - pairs:
      team: boutique
      env: staging
    includeTemplates: true
replacements:
  - source:
      kind: Namespace
      name: boutique-staging
      fieldPath: metadata.name
    targets:
      - select:
          kind: Probe
          name: frontend-canary
        fieldPaths:
          - spec.targets.staticConfig.static.0
        options:
          delimiter: "."
          index: 1
