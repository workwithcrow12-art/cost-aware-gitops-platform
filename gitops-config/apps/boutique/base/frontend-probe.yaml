apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: frontend-canary
spec:
  jobName: boutique-frontend-canary
  interval: 15s
  scrapeTimeout: 10s
  module: http_2xx
  prober:
    path: /probe
    url: blackbox.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - http://frontend-canary.NAMESPACE_PLACEHOLDER.svc.cluster.local:8080/
