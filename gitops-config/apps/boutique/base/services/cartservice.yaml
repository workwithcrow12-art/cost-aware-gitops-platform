apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartservice
  labels:
    app: cartservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cartservice
  template:
    metadata:
      labels:
        app: cartservice
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 5
      containers:
        - name: server
          image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/cartservice@sha256:e5310c2aa45732e351c55c88051700d958dc7ed2693e66405fc6c70cf080109e
          ports:
            - name: grpc
              containerPort: 7070
          env:
            - name: PORT
              value: "7070"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-cart
                  key: password
            - name: REDIS_ADDR
              value: "redis-cart:6379,password=$(REDIS_PASSWORD)"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
          startupProbe:
            grpc:
              port: 7070
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            grpc:
              port: 7070
---
apiVersion: v1
kind: Service
metadata:
  name: cartservice
  labels:
    app: cartservice
spec:
  selector:
    app: cartservice
  ports:
    - name: grpc
      port: 7070
      targetPort: grpc
