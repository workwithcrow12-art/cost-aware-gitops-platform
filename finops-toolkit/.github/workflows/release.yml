name: Release FinOps image

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and smoke-test the tagged image
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}:$TAG"
          docker build --tag "$image" .
          docker run --rm --volume "$PWD/tests/fixtures:/fixtures:ro" "$image" report --fixtures /fixtures
          echo "ref=$image" >> "$GITHUB_OUTPUT"
      - name: Scan the image before publication
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: docker
        with:
          version: v0.76.2
          scan-type: image
          image-ref: ${{ steps.image.outputs.ref }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          timeout: 10m0s
      - name: Push the scanned image
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: docker push "$IMAGE"
