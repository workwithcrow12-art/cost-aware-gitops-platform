[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "finops-toolkit"
version = "0.9.0"
description = "Weekly cloud cost reports and read-only waste estimates"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
finops = "finops.cli:main"

[project.optional-dependencies]
aws = ["boto3>=1.35,<2"]
custodian = ["c7n==0.9.53"]
dev = ["ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
finops = ["sql/*.sql", "templates/*.md"]

[tool.ruff]
target-version = "py311"
line-length = 100
