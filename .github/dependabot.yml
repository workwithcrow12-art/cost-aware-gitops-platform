version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directories:
      - /platform-infra/bootstrap/state-backend
      - /platform-infra/envs/nonprod
      - /platform-infra/envs/prod
      - /platform-infra/envs/aks
      - /platform-infra/envs/gke
      - /platform-infra/modules/budgets
      - /platform-infra/modules/cluster
      - /platform-infra/modules/cost-reporting
      - /platform-infra/modules/iam-github-oidc
      - /platform-infra/modules/karpenter
      - /platform-infra/modules/network
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /finops-toolkit
      - /boutique-app/src/adservice
      - /boutique-app/src/cartservice/src
      - /boutique-app/src/checkoutservice
      - /boutique-app/src/currencyservice
      - /boutique-app/src/emailservice
      - /boutique-app/src/frontend
      - /boutique-app/src/loadgenerator
      - /boutique-app/src/paymentservice
      - /boutique-app/src/productcatalogservice
      - /boutique-app/src/recommendationservice
      - /boutique-app/src/shippingservice
      - /boutique-app/src/shoppingassistantservice
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directories:
      - /finops-toolkit
      - /boutique-app/src/emailservice
      - /boutique-app/src/loadgenerator
      - /boutique-app/src/recommendationservice
      - /boutique-app/src/shoppingassistantservice
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directories:
      - /boutique-app/src/checkoutservice
      - /boutique-app/src/frontend
      - /boutique-app/src/productcatalogservice
      - /boutique-app/src/shippingservice
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directories:
      - /boutique-app/src/currencyservice
      - /boutique-app/src/paymentservice
    schedule:
      interval: weekly

  - package-ecosystem: nuget
    directory: /boutique-app/src/cartservice
    schedule:
      interval: weekly

  - package-ecosystem: gradle
    directory: /boutique-app/src/adservice
    schedule:
      interval: weekly
