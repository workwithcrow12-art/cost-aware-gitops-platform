name: Build and scan service images

on:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true
      publish:
        type: boolean
        required: true

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - adservice
          - cartservice
          - checkoutservice
          - currencyservice
          - emailservice
          - frontend
          - loadgenerator
          - paymentservice
          - productcatalogservice
          - recommendationservice
          - shippingservice
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
          path: image-source
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the service image
        id: image
        env:
          SERVICE: ${{ matrix.service }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          context="image-source/boutique-app/src/$SERVICE"
          if [[ $SERVICE == cartservice ]]; then
            context+=/src
          fi
          ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$SERVICE:$REVISION"
          docker buildx build --platform linux/amd64 --load --tag "$ref" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$REVISION" "$context"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "id=$(docker image inspect --format '{{.Id}}' "$ref")" >> "$GITHUB_OUTPUT"
      - name: Scan the local service image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: docker
        with:
          version: v0.76.2
          cache: ${{ github.event_name != 'workflow_dispatch' }}
          scan-type: image
          image-ref: ${{ steps.image.outputs.ref }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          timeout: 10m0s
      - name: Authenticate to GHCR
        if: inputs.publish
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the scanned image and capture its manifest digest
        if: inputs.publish
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          SCANNED_ID: ${{ steps.image.outputs.id }}
          REVISION: ${{ inputs.revision }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          [[ $SCANNED_ID =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ $(docker image inspect --format '{{.Id}}' "$IMAGE") == "$SCANNED_ID" ]]
          push_log=$(docker push "$IMAGE")
          printf '%s\n' "$push_log"
          digest=$(awk -v tag="$REVISION:" '$1 == tag && $2 == "digest:" && $4 == "size:" {print $3}' <<< "$push_log")
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
          jq -n --arg revision "$REVISION" --arg digest "$digest" \
            '{revision: $revision, digest: $digest}' > "$RUNNER_TEMP/$SERVICE.json"
      - name: Store the scanned image record for this run
        if: inputs.publish
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scanned-image-${{ matrix.service }}
          path: ${{ runner.temp }}/${{ matrix.service }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 3
