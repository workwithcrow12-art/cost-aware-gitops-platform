name: Weekly cloud waste report

on:
  schedule:
    - cron: '15 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    if: ${{ vars.AWS_CUSTODIAN_ROLE_ARN != '' && vars.AWS_REGION != '' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: finops-toolkit
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EBS_GB_MONTH_RATE: ${{ vars.EBS_GB_MONTH_RATE }}
      SNAPSHOT_GB_MONTH_RATE: ${{ vars.SNAPSHOT_GB_MONTH_RATE }}
      EIP_HOURLY_RATE: ${{ vars.EIP_HOURLY_RATE }}
      ALB_HOURLY_RATE: ${{ vars.ALB_HOURLY_RATE }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install '.[custodian]'
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_CUSTODIAN_ROLE_ARN }}
          role-session-name: custodian-weekly-${{ github.run_id }}
      - name: Scan AWS and write aggregate findings
        run: |
          custodian run --dryrun --region "$AWS_REGION" --output-dir output custodian/policies/*.yml
          finops waste --input output --dry-run > waste-report.md
          cat waste-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: finops-waste-report
          path: finops-toolkit/waste-report.md
          if-no-files-found: error
          retention-days: 30
      - name: Notify report result
        if: ${{ !cancelled() && vars.NOTIFIER != '' }}
        env:
          REPORT_STATUS: ${{ job.status }}
          NOTIFIER: ${{ vars.NOTIFIER }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from finops.notifier import notify

          if os.environ['REPORT_STATUS'] == 'success':
              message = Path('waste-report.md').read_text(encoding='utf-8')
          else:
              message = 'Weekly cloud waste report failed. Review the GitHub Actions run logs.'
          notify(message)
          PY
