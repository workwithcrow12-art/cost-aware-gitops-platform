name: Release validation
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitattributes'
      - '.gitignore'
      - '.github/CODEOWNERS'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitattributes'
      - '.gitignore'
      - '.github/CODEOWNERS'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finops:
    uses: ./.github/workflows/finops.yml
  services:
    uses: ./.github/workflows/services.yml
  terraform:
    uses: ./.github/workflows/terraform.yml
  gitops:
    uses: ./.github/workflows/gitops.yml
  images:
    needs: services
    uses: ./.github/workflows/images.yml
    with:
      revision: ${{ github.sha }}
      publish: false
