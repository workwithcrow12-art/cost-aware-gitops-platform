name: Detect Terraform drift

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    if: >-
      github.ref == 'refs/heads/main' && vars.TF_DRIFT_ENABLED == 'true' &&
      vars.AWS_PLAN_ROLE_ARN != '' && vars.TF_STATE_BUCKET != '' && vars.AWS_ACCOUNT_ID != '' &&
      vars.EKS_OPERATOR_ACCESS_CIDRS != '' && vars.EKS_OPERATOR_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: platform-infra
    strategy:
      matrix:
        environment: [nonprod, prod]
    env:
      ENVIRONMENT: ${{ matrix.environment }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      STATE_BUCKET_REGION: ${{ vars.TF_STATE_REGION || 'ap-southeast-1' }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
      TF_VAR_operator_access_cidrs: ${{ vars.EKS_OPERATOR_ACCESS_CIDRS }}
      TF_VAR_operator_role_arn: ${{ vars.EKS_OPERATOR_ROLE_ARN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false
      - name: Check expected AWS account and environment settings
        env:
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          TF_PROD_BUDGET_JSON: ${{ vars.TF_PROD_BUDGET_JSON }}
          EKS_BREAK_GLASS_ROLE_ARN: ${{ vars.EKS_BREAK_GLASS_ROLE_ARN }}
          EKS_OPERATOR_ACCESS_POLICY: ${{ vars.EKS_OPERATOR_ACCESS_POLICY }}
        run: |
          [[ "$EXPECTED_AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          if [[ "$ENVIRONMENT" == "prod" ]]; then
            if [[ -z "${TF_PROD_BUDGET_JSON:-}" ]]; then
              echo 'Set TF_PROD_BUDGET_JSON before running drift detection on prod (var.budget is mandatory in prod).' >&2
              exit 1
            fi
            jq -e 'type == "object" and (.monthly_limit_usd != null) and (.email != null)' <<< "$TF_PROD_BUDGET_JSON" > /dev/null || {
              echo 'TF_PROD_BUDGET_JSON must be a valid JSON object containing monthly_limit_usd and email.' >&2
              exit 1
            }
            {
              echo "TF_VAR_budget<<EOF_TF_BUDGET"
              printf '%s\n' "$TF_PROD_BUDGET_JSON"
              echo "EOF_TF_BUDGET"
            } >> "$GITHUB_ENV"
          fi
          if [[ -n "${EKS_BREAK_GLASS_ROLE_ARN:-}" ]]; then
            printf 'TF_VAR_break_glass_role_arn=%s\n' "$EKS_BREAK_GLASS_ROLE_ARN" >> "$GITHUB_ENV"
          fi
          if [[ -n "${EKS_OPERATOR_ACCESS_POLICY:-}" ]]; then
            printf 'TF_VAR_operator_access_policy=%s\n' "$EKS_OPERATOR_ACCESS_POLICY" >> "$GITHUB_ENV"
          fi
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.TF_VAR_aws_region }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: terraform-drift-${{ github.run_id }}
      - name: Check live resources against state
        run: |
          make init ENV="$ENVIRONMENT"
          mkdir -p "$RUNNER_TEMP/drift"
          plan_exit=0
          terraform -chdir="envs/$ENVIRONMENT" plan -refresh-only -lock=false -input=false -detailed-exitcode -out="$RUNNER_TEMP/drift.tfplan" || plan_exit=$?
          if [ "$plan_exit" -ne 1 ]; then
            terraform -chdir="envs/$ENVIRONMENT" show -json "$RUNNER_TEMP/drift.tfplan" \
              | jq -r '.resource_drift[]? | [.address, (.change.actions | join(","))] | @tsv' \
              > "$RUNNER_TEMP/drift/resources.tsv"
          fi
          printf 'Environment: %s\nExit code: %s (0=no drift, 1=error, 2=drift)\n' "$ENVIRONMENT" "$plan_exit" > "$RUNNER_TEMP/drift/summary.txt"
          cat "$RUNNER_TEMP/drift/summary.txt" >> "$GITHUB_STEP_SUMMARY"
          if [ "$plan_exit" -eq 2 ]; then
            echo "::warning::Drift detected for $ENVIRONMENT"
            echo "Drift detected for **$ENVIRONMENT**. Review the plan in the job log." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$plan_exit"
      - name: Retain drift summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-drift-${{ matrix.environment }}-${{ github.run_id }}
          path: ${{ runner.temp }}/drift/
          retention-days: 7
          if-no-files-found: warn
