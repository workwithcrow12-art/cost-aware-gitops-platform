name: gitops-config checks
on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gitops-config
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
        with:
          version: v1.35.2
      - name: Install validation tools
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/gitops-tools" "${RUNNER_TEMP}/kubeconform-cache"
          cd "${RUNNER_TEMP}/gitops-tools"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            --output kubeconform-linux-amd64.tar.gz
          echo "c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3  kubeconform-linux-amd64.tar.gz" | sha256sum --check
          tar -xz -f kubeconform-linux-amd64.tar.gz kubeconform
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/kyverno/kyverno/releases/download/v1.18.1/kyverno-cli_v1.18.1_linux_x86_64.tar.gz \
            --output kyverno-cli_v1.18.1_linux_x86_64.tar.gz
          echo "5e6bba9ca85beec6c93e94ca7fb0972a66df3b2e67636a08bef090cd3fc6535c  kyverno-cli_v1.18.1_linux_x86_64.tar.gz" | sha256sum --check
          tar -xz -f kyverno-cli_v1.18.1_linux_x86_64.tar.gz kyverno
          echo "${RUNNER_TEMP}/gitops-tools" >> "$GITHUB_PATH"
      - name: Render and validate manifests
        shell: bash
        run: |
          crd_schema='https://raw.githubusercontent.com/datreeio/CRDs-catalog/04af58d740718c4dc719441bf39fb284c784f4a8/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          kubeconform -strict -cache "${RUNNER_TEMP}/kubeconform-cache" \
            -schema-location default -schema-location "$crd_schema" \
            -summary -kubernetes-version 1.35.0 bootstrap/root-app.yaml
          for path in apps/boutique/overlays/{dev,staging,prod,preview} \
                      bootstrap/{nonprod,nonprod-managed,prod} \
                      platform/{kyverno/policies,monitoring/alerts,monitoring/notifications,finops-reporter,kube-downscaler,storage}; do
            echo "Validating $path"
            kubectl kustomize "$path" | kubeconform -strict \
              -cache "${RUNNER_TEMP}/kubeconform-cache" \
              -schema-location default -schema-location "$crd_schema" \
              -summary -kubernetes-version 1.35.0
          done
      - name: Test Kyverno guardrails
        run: kyverno test platform/kyverno/tests
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.18.6
      - name: Render monitoring profiles
        shell: bash
        run: |
          crd_schema='https://raw.githubusercontent.com/datreeio/CRDs-catalog/04af58d740718c4dc719441bf39fb284c784f4a8/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          for profile in nonprod prod; do
            values=(-f platform/monitoring/values.yaml)
            if [[ "$profile" == prod ]]; then
              values+=(-f platform/monitoring/values-prod.yaml)
            fi
            helm template monitoring kube-prometheus-stack \
              --repo https://prometheus-community.github.io/helm-charts --version 92.7.0 \
              --namespace monitoring "${values[@]}" \
              | kubeconform -strict -ignore-missing-schemas \
                -cache "${RUNNER_TEMP}/kubeconform-cache" \
                -schema-location default -schema-location "$crd_schema" \
                -summary -kubernetes-version 1.35.0
          done
      - name: Enforce Kyverno policies on rendered workloads
        shell: bash
        run: |
          for target in dev staging prod preview; do
            kubectl kustomize "apps/boutique/overlays/$target" \
              | kubectl label --local -f - -o json validation=true \
              | jq -rs '[.[] | select(.kind == "Deployment" or .kind == "Rollout")
                  | {apiVersion: "v1", kind: "Pod",
                     metadata: {
                       name: .metadata.name,
                       namespace: .metadata.namespace,
                       labels: (.spec.template.metadata.labels // {})
                     },
                     spec: .spec.template.spec}]
                  | if length == 0 then error("no workload pods found")
                    else .[] | "---\n" + tojson end' \
              > "$RUNNER_TEMP/pods-$target.yaml"
            kyverno apply platform/kyverno/policies \
              --resource "$RUNNER_TEMP/pods-$target.yaml"
          done
          kubectl kustomize platform/finops-reporter \
            | kubectl label --local -f - -o json validation=true \
            | jq -rs '[.[] | select(.kind == "CronJob")
                | {apiVersion: "v1", kind: "Pod",
                   metadata: {
                     name: .metadata.name,
                     namespace: (.metadata.namespace // "finops"),
                     labels: (.spec.jobTemplate.spec.template.metadata.labels // {})
                   },
                   spec: .spec.jobTemplate.spec.template.spec}]
                | if length == 0 then error("no finops CronJob pods found")
                  else .[] | "---\n" + tojson end' \
            > "$RUNNER_TEMP/pods-finops.yaml"
          kyverno apply platform/kyverno/policies \
            --resource "$RUNNER_TEMP/pods-finops.yaml"
      - name: Scan deployed Redis digests
        shell: bash
        run: |
          archive=trivy_0.76.2_Linux-64bit.tar.gz
          cd "$RUNNER_TEMP/gitops-tools"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/aquasecurity/trivy/releases/download/v0.76.2/$archive" --output "$archive"
          echo "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  $archive" | sha256sum --check
          tar -xz -f "$archive" trivy
          cd "$GITHUB_WORKSPACE/gitops-config"

          images=$(
            for target in dev staging prod; do
              kubectl kustomize "apps/boutique/overlays/$target" \
                | kubectl label --local -f - -o json scan=redis \
                | jq -ers '
                  [.[] | select(.kind == "Deployment" and .metadata.name == "redis-cart")
                  | .spec.template.spec.containers[] | select(.name == "redis") | .image]
                  | if length == 1 then .[0] else error("expected one deployed Redis image") end
                ' || exit 1
            done
          )
          sort -u <<< "$images" | while IFS= read -r image; do
            [[ "$image" =~ @sha256:[0-9a-f]{64}$ ]]
            trivy image --image-src remote --platform linux/amd64 --scanners vuln \
              --severity HIGH,CRITICAL --exit-code 1 --exit-on-eol 1 --no-progress "$image"
          done
