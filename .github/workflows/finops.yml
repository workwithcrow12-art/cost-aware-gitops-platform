name: finops-toolkit checks
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finops-toolkit
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev,custodian]'
      - run: make lint test
      - name: Check the offline portfolio demo runner
        run: python -m unittest discover -s ../scripts/tests -v
      - run: custodian validate custodian/policies/*.yml
      - run: finops report --fixtures tests/fixtures
      - run: finops cloud-report --input tests/fixtures/focus_sample.csv --as-of 2026-01-19
      - run: finops waste --input tests/fixtures/custodian --dry-run
      - run: docker build --tag finops-toolkit:ci .
      - run: docker run --rm --network none --volume "$PWD/tests:/tests:ro" --entrypoint python finops-toolkit:ci -m unittest discover -s /tests -v
      - name: Scan FinOps image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: docker
        with:
          version: v0.76.2
          image-ref: finops-toolkit:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          timeout: 10m0s
      - run: docker run --rm --volume "$PWD/tests/fixtures:/fixtures:ro" finops-toolkit:ci report --fixtures /fixtures
      - run: docker run --rm --volume "$PWD/tests/fixtures:/fixtures:ro" finops-toolkit:ci cloud-report --input /fixtures/focus_sample.csv --as-of 2026-01-19
      - run: docker run --rm --volume "$PWD/tests/fixtures:/fixtures:ro" finops-toolkit:ci waste --input /fixtures/custodian --dry-run
