name: Service tests
on:
  workflow_call:
permissions:
  contents: read
jobs:
  test-go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, checkoutservice, productcatalogservice, shippingservice]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: boutique-app/src/${{ matrix.service }}/go.sum
      - run: go vet ./...
        working-directory: boutique-app/src/${{ matrix.service }}
      - run: go test -race ./...
        working-directory: boutique-app/src/${{ matrix.service }}

  test-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: ./gradlew test --no-daemon
        working-directory: boutique-app/src/adservice

  test-cart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test boutique-app/src/cartservice/tests/cartservice.tests.csproj
      - run: python3 -m unittest discover -s boutique-app/.github/tests

  test-node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [currencyservice, paymentservice]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: boutique-app/src/${{ matrix.service }}/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: boutique-app/src/${{ matrix.service }}
      - run: npm test
        working-directory: boutique-app/src/${{ matrix.service }}

  test-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [emailservice, recommendationservice, loadgenerator]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: boutique-app/src/${{ matrix.service }}/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: boutique-app/src/${{ matrix.service }}
      - run: python -m unittest discover -v
        working-directory: boutique-app/src/${{ matrix.service }}

  test-shopping-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
      - run: python -m pip install flask==3.1.3
      - run: python -m unittest discover -v
        working-directory: boutique-app/src/shoppingassistantservice
