name: Service tests
on:
  workflow_call:
permissions:
  contents: read
jobs:
  test-go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, checkoutservice, productcatalogservice, shippingservice]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: boutique-app/src/${{ matrix.service }}/go.sum
      - run: go test -race ./...
        working-directory: boutique-app/src/${{ matrix.service }}

  test-cart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test boutique-app/src/cartservice/tests/cartservice.tests.csproj
      - run: python3 -m unittest discover -s boutique-app/.github/tests

  test-node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [currencyservice, paymentservice]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: boutique-app/src/${{ matrix.service }}/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: boutique-app/src/${{ matrix.service }}
      - run: npm test
        working-directory: boutique-app/src/${{ matrix.service }}

  test-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [emailservice, recommendationservice]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: boutique-app/src/${{ matrix.service }}/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: boutique-app/src/${{ matrix.service }}
      - run: python -m unittest discover -v
        working-directory: boutique-app/src/${{ matrix.service }}

