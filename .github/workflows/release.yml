name: Publish release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require successful validation of the current main commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          main=$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')
          [[ "$main" == "$REVISION" ]]
          gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$REVISION&status=success&event=push" \
            --jq '[.workflow_runs[] | select(.head_branch == "main")] | length' | grep -Eq '^[1-9][0-9]*$'
  boutique:
    needs: verify
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      revision: ${{ github.sha }}
      publish: true
  finops:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: finops-toolkit
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and smoke-test the tagged image
        id: image
        env:
          REPOSITORY: ${{ github.repository_owner }}/finops-toolkit
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}:$TAG"
          docker build --tag "$image" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
          docker run --rm --volume "$PWD/tests/fixtures:/fixtures:ro" "$image" report --fixtures /fixtures
          echo "ref=$image" >> "$GITHUB_OUTPUT"
          echo "id=$(docker image inspect --format '{{.Id}}' "$image")" >> "$GITHUB_OUTPUT"
      - name: Scan the image before publication
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: docker
        with:
          version: v0.76.2
          scan-type: image
          image-ref: ${{ steps.image.outputs.ref }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          timeout: 10m0s
      - name: Push the scanned image and capture its manifest digest
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          SCANNED_ID: ${{ steps.image.outputs.id }}
          TAG: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ $SCANNED_ID =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ $(docker image inspect --format '{{.Id}}' "$IMAGE") == "$SCANNED_ID" ]]
          push_log=$(docker push "$IMAGE")
          printf '%s\n' "$push_log"
          digest=$(awk -v tag="$TAG:" '$1 == tag && $2 == "digest:" && $4 == "size:" {print $3}' <<< "$push_log")
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
          pinned="${IMAGE%:*}@$digest"
          printf '### FinOps Toolkit Image Digest\n\n`%s`\n' "$pinned" >> "$GITHUB_STEP_SUMMARY"
          jq -n --arg revision "$REVISION" --arg tag "$TAG" --arg digest "$digest" --arg image "$pinned" \
            '{revision: $revision, tag: $tag, digest: $digest, image: $image}' > "$RUNNER_TEMP/finops-toolkit.json"
      - name: Store the FinOps image digest record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scanned-image-finops-toolkit
          path: ${{ runner.temp }}/finops-toolkit.json
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  release:
    needs: [boutique, finops]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Create the release after all images are published
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes_file=".github/docs/releases/$TAG.md"
          if [[ -f "$notes_file" ]]; then
            gh release create "$TAG" --repo "$REPO" --verify-tag --title "$TAG" --notes-file "$notes_file"
          else
            gh release create "$TAG" --repo "$REPO" --verify-tag --title "$TAG" --generate-notes
          fi
