name: Publish v0.9
on:
  push:
    tags: [v0.9]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require successful validation of the current main commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          main=$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')
          [[ "$main" == "$REVISION" ]]
          gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$REVISION&status=success&event=push" \
            --jq '[.workflow_runs[] | select(.head_branch == "main")] | length' | grep -Eq '^[1-9][0-9]*$'
  boutique:
    needs: verify
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      revision: ${{ github.sha }}
      publish: true
  finops:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: finops-toolkit
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and smoke-test the tagged image
        id: image
        env:
          REPOSITORY: ${{ github.repository_owner }}/finops-toolkit
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}:$TAG"
          docker build --tag "$image" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
          docker run --rm --volume "$PWD/tests/fixtures:/fixtures:ro" "$image" report --fixtures /fixtures
          echo "ref=$image" >> "$GITHUB_OUTPUT"
      - name: Scan the image before publication
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: docker
        with:
          version: v0.76.2
          scan-type: image
          image-ref: ${{ steps.image.outputs.ref }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          timeout: 10m0s
      - name: Push the scanned image
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: docker push "$IMAGE"

  release:
    needs: [boutique, finops]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Create the release after all images are published
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh release create v0.9 --repo "$REPO" --verify-tag --title 'v0.9' --notes-file .github/docs/releases/v0.9.md
