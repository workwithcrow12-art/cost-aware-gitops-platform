name: Build Online Boutique

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      preview-pr:
        description: Same-repository pull request with the preview label
        type: string
        required: true
      preview-sha:
        description: Full head SHA approved for this preview
        type: string
        required: true

permissions:
  contents: read

env:
  PREVIEW_PR_FILTER: >-
    .state == "open" and .base.ref == "main" and
    .head.repo.full_name == $repo and .head.sha == $head and
    (.labels | any(.name == "preview"))

concurrency:
  group: boutique-build-${{ github.event.pull_request.number || inputs.preview-pr || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Select the revision to build
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          PROTECTED: ${{ github.ref_protected }}
          PR_NUMBER: ${{ inputs.preview-pr }}
          PR_HEAD: ${{ inputs.preview-sha }}
        run: |
          set -euo pipefail
          revision=$GITHUB_SHA
          if [[ $GITHUB_EVENT_NAME != pull_request &&
                ( $GITHUB_REF != refs/heads/main || $PROTECTED != true ) ]]; then
            echo "::error::Publishing requires the protected main branch."
            exit 1
          fi
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            [[ $PR_NUMBER =~ ^[1-9][0-9]*$ && $PR_HEAD =~ ^[0-9a-f]{40}$ ]]
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" | jq -e \
              --arg repo "$GITHUB_REPOSITORY" --arg head "$PR_HEAD" "$PREVIEW_PR_FILTER" >/dev/null
            revision=$PR_HEAD
          fi
          echo "sha=$revision" >> "$GITHUB_OUTPUT"

  test-go:
    needs: prepare
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, checkoutservice, productcatalogservice, shippingservice]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: src/${{ matrix.service }}/go.sum
      - run: go test ./...
        working-directory: src/${{ matrix.service }}

  test-cart:
    needs: prepare
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test src/cartservice/tests/cartservice.tests.csproj
      - run: python3 -m unittest discover -s .github/tests

  test-node:
    needs: prepare
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [currencyservice, paymentservice]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/${{ matrix.service }}/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: src/${{ matrix.service }}
      - run: npm test
        working-directory: src/${{ matrix.service }}

  test-python:
    needs: prepare
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [emailservice, recommendationservice]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: src/${{ matrix.service }}/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: src/${{ matrix.service }}
      - run: python -m unittest discover -v
        working-directory: src/${{ matrix.service }}

  check-images:
    needs: [prepare, test-go, test-cart, test-node, test-python]
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/images.yml
    with:
      revision: ${{ needs.prepare.outputs.revision }}
      publish: false

  publish-images:
    needs: [prepare, test-go, test-cart, test-node, test-python]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && needs.test-go.result == 'success' &&
          needs.test-cart.result == 'success' && needs.test-node.result == 'success' &&
          needs.test-python.result == 'success'))
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      revision: ${{ needs.prepare.outputs.revision }}
      publish: true

  promote:
    needs: [prepare, publish-images]
    if: github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-latest
    environment: gitops-promotion
    steps:
      - name: Check that the release revision is still current
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ needs.prepare.outputs.revision }}
          PR_NUMBER: ${{ inputs.preview-pr }}
        run: |
          set -euo pipefail
          [[ $REVISION =~ ^[0-9a-f]{40}$ ]]
          current=false
          if [[ $GITHUB_EVENT_NAME == push ]]; then
            head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
            if [[ $head == "$REVISION" && -z $PR_NUMBER ]]; then
              current=true
            fi
          elif [[ $GITHUB_EVENT_NAME == workflow_dispatch && $PR_NUMBER =~ ^[1-9][0-9]*$ ]]; then
            pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
            if jq -e --arg repo "$GITHUB_REPOSITORY" --arg head "$REVISION" \
              "$PREVIEW_PR_FILTER" <<< "$pr" >/dev/null; then
              current=true
            fi
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
      - name: Check out trusted workflow source
        if: steps.source.outputs.current == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: workflow-source
          persist-credentials: false
      - name: Read scanned digests from this workflow run
        if: steps.source.outputs.current == 'true'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: ${{ runner.temp }}/scanned-images
          pattern: scanned-image-*
      - name: Validate the digest set
        if: steps.source.outputs.current == 'true'
        env:
          REVISION: ${{ needs.prepare.outputs.revision }}
          PR_NUMBER: ${{ inputs.preview-pr }}
        run: |
          set -euo pipefail
          target=dev
          if [[ -n $PR_NUMBER ]]; then
            target=preview
          fi
          python3 workflow-source/.github/scripts/scanned-images.py \
            "$RUNNER_TEMP/scanned-images" "${GITHUB_REPOSITORY_OWNER,,}" "$REVISION" "$target" \
            > "$RUNNER_TEMP/release.json"
      - name: Check out GitOps configuration
        if: steps.source.outputs.current == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ vars.GITOPS_REPOSITORY || format('{0}/gitops-config', github.repository_owner) }}
          ref: main
          path: gitops
          fetch-depth: 0
          token: ${{ secrets.GITOPS_TOKEN }}
      - name: Open or refresh the deployment PR
        if: steps.source.outputs.current == 'true'
        working-directory: gitops
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          GITOPS_REPO: ${{ vars.GITOPS_REPOSITORY || format('{0}/gitops-config', github.repository_owner) }}
          REVISION: ${{ needs.prepare.outputs.revision }}
          PR_NUMBER: ${{ inputs.preview-pr }}
        run: |
          set -euo pipefail
          if [[ -n $PR_NUMBER ]]; then
            branch="automation/preview-$PR_NUMBER"
            target="preview PR #$PR_NUMBER"
            release="apps/boutique/preview-releases/$PR_NUMBER/$REVISION.json"
            mkdir -p "$(dirname "$release")"
            cp "$RUNNER_TEMP/release.json" "$release"
            git add "$release"
          else
            branch=automation/dev-images
            target=dev
            mapfile -t images < <(jq -r '.images[]' "$RUNNER_TEMP/release.json")
            pushd apps/boutique/overlays/dev
            kustomize edit set image "${images[@]}"
            kustomize build . >/dev/null
            popd
            git add apps/boutique/overlays/dev/kustomization.yaml
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -m "chore(gitops): deploy Boutique ${REVISION:0:12} to $target"
          git push --force-with-lease origin "HEAD:refs/heads/$branch"
          body="Deploy scanned image digests from $GITHUB_REPOSITORY commit $REVISION to $target."
          if [[ -z $(gh pr list --repo "$GITOPS_REPO" --state open --base main --head "$branch" --json number --jq '.[0].number') ]]; then
            gh pr create --repo "$GITOPS_REPO" --base main --head "$branch" \
              --title "chore(gitops): promote Online Boutique to $target" --body "$body"
          else
            gh pr edit "$branch" --repo "$GITOPS_REPO" --body "$body"
          fi
